spring.application.name=dromatic-inventory

# ── Base de datos ──────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dromatic_inventory}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── JWT ─────────────────────────────────────────
jwt.secret=${JWT_SECRET:dromatic_default_dev_secret_change_me_please_1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Servidor ────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── CORS ────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
