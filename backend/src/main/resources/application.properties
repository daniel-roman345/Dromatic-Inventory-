spring.application.name=dromatic-inventory-system

# Las variables se pueden definir en backend/.env (ver .env.example). Ese archivo no se sube al repositorio.
spring.config.import=optional:file:.env[.properties]

# ── Base de datos ──────────────────────────────────────────────────────
# La base se crea sola si no existe. Flyway crea y actualiza las tablas (db/migration).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dromatic_dis}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate solo valida que las entidades coincidan con las tablas de Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ── Seguridad ──────────────────────────────────────────────────────────
# Si JWT_SECRET no se define se genera una clave temporal al iniciar.
jwt.secret=${JWT_SECRET:}
# 8 horas: una jornada de trabajo
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.security.max-failed-attempts=5
app.security.lock-minutes=${LOCK_MINUTES:15}

# ── Imágenes de artículos ──────────────────────────────────────────────
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# ── Correo para alertas de stock bajo ─────────────────────────────────
# Se activa llenando MAIL_HOST, MAIL_USERNAME y MAIL_PASSWORD en backend/.env
#   Gmail:   MAIL_HOST=smtp.gmail.com       MAIL_PORT=587 (usar "contraseña de aplicación")
#   Outlook: MAIL_HOST=smtp.office365.com   MAIL_PORT=587
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
app.mail.from=${MAIL_FROM:}

# Quien recibe las alertas la primera vez que arranca el sistema (luego se cambia en Usuarios).
# Correo y WhatsApp (con indicativo, sin +) se definen en backend/.env, nunca en el repositorio.
app.alerts.initial-email=${ALERT_EMAIL:}
app.alerts.initial-whatsapp=${ALERT_WHATSAPP_PHONE:}

# Archivo local (excluido de git) donde quedan las contraseñas temporales iniciales.
app.bootstrap.credentials-file=${CREDENTIALS_FILE:.credenciales.txt}

# ── Datos de la empresa (encabezados de reportes, correos y mensajes) ──
# Spring lee este archivo como ISO-8859-1: las tildes se escriben como escapes Unicode (ej. Medell\u00edn).
app.company.name=Laboratorios Dromatic
app.company.address=Carrera 64AA # 113-96, Autopista Norte, Medell\u00edn
app.company.phone=+57 604 444 43 41
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}

# ── Servidor ───────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ── CORS ───────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
