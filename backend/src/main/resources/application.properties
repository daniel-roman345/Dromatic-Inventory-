spring.application.name=dromatic-inventory

# Permite definir las variables en backend/.env (ver .env.example). No se sube al repositorio.
spring.config.import=optional:file:.env[.properties]

# ── Base de datos ──────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dromatic_inventory}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────
# Las tablas se crean con database/database.sql; Hibernate solo valida que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ─────────────────────────────────────────
# Si JWT_SECRET no se define se genera una clave temporal al iniciar.
jwt.secret=${JWT_SECRET:}
# 8 horas (una jornada de trabajo)
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ── Seguridad de inicio de sesión ───────────────
app.security.max-failed-attempts=5
app.security.lock-minutes=${LOCK_MINUTES:15}

# ── Servidor ────────────────────────────────────
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ── CORS ────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
